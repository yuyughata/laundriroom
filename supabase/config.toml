# Supabase local config. `project_id` is set when you run `supabase link`.
project_id = "fresco-laundry"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true   # customers can order before verifying; reminders chase unverified emails

# Ink & Ivory auth emails — generated by `npm run emails:auth` from src/lib/emails.ts.
# For the hosted project, paste the same files into Authentication → Email Templates.
[auth.email.template.confirmation]
subject = "Confirm your laundriroom email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your laundriroom password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your laundriroom sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new laundriroom email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "You've been invited to laundriroom"
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Your laundriroom verification code"
content_path = "./supabase/templates/reauthentication.html"


[storage]
enabled = true
file_size_limit = "10MiB"
