<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sign in to laundriroom</title>
</head>
<body style="margin:0;padding:0;background:#F8F5EF;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Your one-time sign-in link</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F8F5EF;padding:28px 16px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;">
      <!-- header: brand icon + wordmark -->
      <tr><td style="padding:4px 4px 20px;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="padding-right:9px;vertical-align:middle;">
            <img src="{{ .SiteURL }}/brand/mark-email.png" width="32" height="24" alt="" style="display:block;width:32px;height:24px;border:0;outline:none;text-decoration:none;">
          </td>
          <td style="vertical-align:middle;">
            <span style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700;color:#0F1B2D;letter-spacing:-.3px;">laundriroom</span>
          </td>
        </tr></table>
      </td></tr>
      <!-- card -->
      <tr><td style="background:#FFFFFF;border:1px solid #EFEAE0;border-radius:16px;overflow:hidden;">
        <div style="height:4px;background:#C6A664;"></div>
        <div style="padding:32px 32px 28px;">
          <h1 style="margin:0 0 18px;font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:1.25;color:#0F1B2D;font-weight:700;">Sign in to laundriroom</h1>
          <p style="margin:0 0 16px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#2B3A52;">Tap below to sign in as <strong>{{ .Email }}</strong>. The link works once and expires soon.</p>
          
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0 8px;">
        <tr><td style="border-radius:999px;background:#0F1B2D;">
          <a href="{{ .ConfirmationURL }}" target="_blank"
             style="display:inline-block;padding:13px 28px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:600;color:#F8F5EF;text-decoration:none;border-radius:999px;">Sign in</a>
        </td></tr>
       </table>
          <p style="margin:20px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#5B6678;">Didn't try to sign in? You can ignore this email.</p>
        </div>
      </td></tr>
      <!-- footer -->
      <tr><td style="padding:22px 8px;">
        <p style="margin:0 0 4px;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#5B6678;">laundriroom — laundry, handled.</p>
        <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#5B6678;">You're receiving this because you have a laundriroom account.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
